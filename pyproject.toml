[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper2tree"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.86.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "anyio>=4.0",
    "tenacity>=8.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.scripts]
paper2tree = "src.main:cli"
paper2tree-server = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
